[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# 行の長さは ruff format に任せる (日本語コメントは全角で幅を数えられるため)。
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
# README のコード例は元のレイアウトのまま残す。
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
