[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Ruff は全角文字を幅 2 として数え、日本語コメントが引っかかるので E501 は無効にする。
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
# README のコード例は元のレイアウトのまま残す。
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
