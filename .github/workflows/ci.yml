name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じ PR に続けて push したら古い run はキャンセルする。main への push はキャンセルしない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t name-space-package-lab .
      # Dockerfile の USER app が外れていないか (非 root で動くか)。
      # lint・テスト・各パターンの実行は readme ジョブが README のコマンドで行う。
      - run: test "$(docker run --rm name-space-package-lab id -u)" = 10001

  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # README の ```bash ブロックを上から順にそのまま実行する。手順が古くなったらここで落ちる。
      # 最後のブロック (ロック更新) のあと、追跡ファイルに差分がないことと、
      # 生成したロックが runner のユーザー所有になることも確認する。
      - run: |
          awk '/^```bash$/{f=1; next} /^```$/{f=0; next} f' README.md > /tmp/readme.sh
          test -s /tmp/readme.sh
          bash -euo pipefail /tmp/readme.sh
          git diff --exit-code
          test "$(stat -c %u requirements-dev.txt)" = "$(id -u)"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pytest
