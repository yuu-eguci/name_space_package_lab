name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t name-space-package-lab .
      - run: docker run --rm name-space-package-lab ruff check .
      - run: docker run --rm name-space-package-lab ruff format --check .
      - run: docker run --rm name-space-package-lab pytest
      - run: |
          for p in 1 2 3; do
            docker run --rm name-space-package-lab python main.py "$p"
          done
          docker run --rm name-space-package-lab python solution.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pytest
